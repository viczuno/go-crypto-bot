services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: crypto
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crypto']
      interval: 5s
      retries: 10
volumes:
  postgres-data:
