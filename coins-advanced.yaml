# Example configuration with all source types
coin_sources:
  # Core coins to always track
  - type: static
    coins:
      - id: bitcoin
        name: Bitcoin
        symbol: BTC
        tags: [layer1, pow, core]
      - id: ethereum
        name: Ethereum
        symbol: ETH
        tags: [layer1, pos, smart-contracts, core]

  # Top 5 coins by market cap (excluding stablecoins)
  - type: top_by_market_cap
    count: 5
    exclude: [tether, usd-coin, binance-usd, dai, true-usd]

  # Trending coins
  - type: trending
    count: 3

display_options:
  sort_by: market_cap
  max_display: 10  # Limit to 10 coins total
